<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
            body{
                background-color: aquamarine;
                font-family: cursive;
                text-align:center;
                padding: 30px;

            }
            h1{
                color:blueviolet;
            }
            #zoo{
                border:5px solid blueviolet;
                padding:10px;
                margin:5px;
                border-radius: 30px;
                text-align: left;
            }
            .zone{
                border:3px solid olivedrab;
                padding: 10px;
                border-radius: 10px;
                margin:2px;
            }
            button{
                background-color: lightblue;
                color:blueviolet;
                font-size: 20px;
                padding:3px;
                margin:5px;
            }
        
    </style>
</head>
<body>
    <h1>My zoo</h1>
    <p>using java script and html change the the animals in each zone</p>
    <div id="zoo">
        <div class="zone">Zone 1
            <span id="zone1"></span>
        </div>
    <div class="zone">Zone 2
        <span id="zone2"></span>
    </div>
    <div class="zone">Zone 3
        <span id="zone3"></span>
    </div>
    <div class="zone">Total animals
        <span id="total"></span>
    </div>
    </div>
    <button onclick="openzoo()">click to open the zoo</button>
    <p id="status"></p>
    <script>
        function openzoo(){
            document.getElementById("zone1").innerHTML="panda";
        document.getElementById("status").innerHTML = "My zoo is now open";
        document.getElementById("zone2").innerHTML = "lion";
        document.getElementById("zone3").innerHTML = "tiger";
        document.getElementById("total").innerHTML = "3";
        document.getElementById("zoo").style.backgroundColor="lightblue";
        
        }
    </script>
</body>
</html>
